<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Designer Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- HEADER -->
    <header class="header">
        <div class="container">

            <a href="index.html" class="logo">
                <img src="images/logo.svg" alt="Logo">
                Logo Here
            </a>

            <!-- nav -->
            <nav class="header__nav">
                <a href="#!" class="header__link">Home</a>
                <a href="#!" class="header__link">Work</a>
                <a href="#!" class="header__link">Contact</a>
            </nav>

        </div>
    </header>

    <!-- MAIN -->
    <main class="main">

        <!-- Section welcome -->
        <section class="welcome">
            <div class="container">

                <div class="welcome__wrapper">
                    <h1 class="welcome__title">
                        Hi, I am Your Name
                        A Product Designer
                        based in City.
                    </h1>
                    <p class="welcome__text">
                        I help businesses and companies reach their goals by designing user-centric digital products &
                        interactive experiences.
                    </p>
                    <a href="mailto:hi@yourname.com" class="btn welcome__btn">hi@yourname.com</a>
                </div>

                <img src="images/me.jpg" alt="Author's portfolio" class="welcome__img">

            </div>
        </section>
        <!-- Block works -->
        <div class="works">
            <div class="container">
                <button type="button" class="works__btn">Featured Work</button>

                <div class="works-wrapper">
                    <a href="#!" class="work">
                        <img src="images/work1.jpg" alt="Project" class="work__img">
                        <span class="work__name">InVersion</span>
                    </a>
                    <a href="#!" class="work">
                        <img src="images/work2.jpg" alt="Project" class="work__img">
                        <span class="work__name">Project 2</span>
                    </a>
                    <a href="#!" class="work">
                        <img src="images/work3.jpg" alt="Project" class="work__img">
                        <span class="work__name">Project 3</span>
                    </a>
                    <a href="#!" class="work">
                        <img src="images/work4.jpg" alt="Project" class="work__img">
                        <span class="work__name">Project 4</span>
                    </a>
                </div>
            </div>

        </div>
    </main>
</body>

</html>
